name: ihs-scan

on:
  schedule:
    # 每 4 小時：頭肩底（Inverse Head and Shoulders）全市場掃描＋Discord 突破通知
    # 4h 是本策略支援的最細 timeframe，跟掃描頻率對齊即可，不需要更頻繁
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-commit
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests pandas

      - name: IHS scan
        env:
          DISCORD_WEBHOOK_URL_IHS: ${{ secrets.DISCORD_WEBHOOK_URL_IHS }}
        run: python scripts/ihs_scan.py

      - name: Commit and push
        run: |
          git config user.name "market-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ihs_state.json data/ihs_half_state.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto(ihs): $(date -u +'%Y-%m-%dT%H:%MZ')"
            git pull --rebase origin main
            git push
          fi
